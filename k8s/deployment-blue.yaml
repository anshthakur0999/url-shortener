apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-blue
  namespace: url-shortener
  labels:
    app: url-shortener
    version: blue
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-shortener
      version: blue
  template:
    metadata:
      labels:
        app: url-shortener
        version: blue
        environment: production
    spec:
      containers:
      - name: url-shortener
        image: url-shortener:latest  # Will be updated by Jenkins
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: NODE_ENV
        - name: NEXT_TELEMETRY_DISABLED
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: NEXT_TELEMETRY_DISABLED
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: url-shortener-config
              key: PORT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: url-shortener-secrets
              key: DATABASE_URL
        - name: KV_REST_API_URL
          valueFrom:
            secretKeyRef:
              name: url-shortener-secrets
              key: KV_REST_API_URL
        - name: KV_REST_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: url-shortener-secrets
              key: KV_REST_API_TOKEN
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/urls
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/urls
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always

